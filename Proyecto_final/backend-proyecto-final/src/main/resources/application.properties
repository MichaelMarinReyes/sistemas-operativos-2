spring.application.name=backend-proyecto-final
spring.config.import=optional:file:.env[.properties]
server.port=${SERVER_PORT:18080}
# Rechazar decimales para cantidades enteras, sin redondearlos silenciosamente.
spring.jackson.deserialization.accept-float-as-int=false
simulation.worker-count=${SIMULATION_WORKER_COUNT:10}
simulation.simulated-seconds-per-real-second=${SIMULATION_TIME_SCALE:60}
simulation.preparation-seconds-per-unit=${SIMULATION_PREPARATION_SECONDS:60}
